<article class="proj-card">
  <div class="proj-media {% if include.p.fit %}proj-media--{{ include.p.fit }}{% endif %}"
       {% if style_bits != "" %}style="{{ style_bits }}"{% endif %}>

    {% if src contains '.mp4' or src contains '.webm' or src contains '.mov' %}
      <video
        class="proj-img proj-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        {% if include.p.poster %}poster="{{ include.p.poster }}"{% endif %}
        aria-label="{{ include.p.title }}"
        onclick="window.location='{{ include.p.url }}'"
        style="cursor: pointer;"
      >
        <source src="{{ include.p.image }}" type="video/mp4" />
      </video>
    {% else %}
      <a class="proj-link" href="{{ include.p.url }}" aria-label="{{ include.p.title }}">
        <img class="proj-img" src="{{ include.p.image }}" alt="{{ include.p.title }}" loading="lazy" />
      </a>
    {% endif %}

    <div class="proj-overlay" onclick="window.location='{{ include.p.url }}'" style="cursor: pointer;">
      ...overlay content...
    </div>
  </div>

  <h3 class="proj-title">
    <a href="{{ include.p.url }}">{{ include.p.title }}</a>
  </h3>
</article>
