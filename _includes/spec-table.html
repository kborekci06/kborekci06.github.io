{% assign proj = site.data.projects[include.slug] %}
{% assign d = proj.specs %}

{% if d and d.rows %}
<table class="spec-table">
  {% if d.title %}<caption>{{ d.title }}</caption>{% endif %}
  <tbody>
    {% for row in d.rows %}
      <tr>
        <th scope="row">{{ row.label }}</th>
        <td>{{ row.value }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<!-- spec-table: missing data for slug={{ include.slug }} -->
{% endif %}
