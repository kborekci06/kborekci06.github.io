<table class="spec-table">
    {% if include.title %}
      <caption>{{ include.title }}</caption>
    {% endif %}
    <tbody>
      {% for row in include.rows %}
        <tr>
          <th scope="row">{{ row.label }}</th>
          <td>{{ row.value }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
