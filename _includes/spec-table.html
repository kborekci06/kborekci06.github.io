{% assign d = site.data.projects[include.slug].specs %}
<table class="spec-table">
  {% if d.title %}<caption>{{ d.title }}</caption>{% endif %}
  <tbody>
    {% for row in d.rows %}
      <tr>
        <th scope="row">{{ row.label }}</th>
        <td>{{ row.value }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
