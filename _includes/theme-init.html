{%- comment -%}
  Pre-paint theme: runs before first render so a stored choice never flashes.
  No stored choice = no data-theme, and CSS follows prefers-color-scheme (_sass/_tokens.scss).
{%- endcomment -%}
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
