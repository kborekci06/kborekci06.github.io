- id: rogers-hydrocephalus-2019
  date: "2019"
  date_inferred: false
  title: Hydrocephalus shunt flow monitor
  role: High-school intern, Rogers Lab
  hover: A high-school internship on a wireless shunt-flow sensor committed me to biomedical engineering.
  detail: >-
    In the summer of 2019, while still in high school, I joined the Rogers Lab on a wireless,
    non-invasive, flexible system that monitors cerebrospinal fluid flow in hydrocephalus shunts.
    I evaluated embedded sensor systems for flow detection, characterized device drift, and helped
    validate phantom-model experiments. I am a co-author on the 2020 paper, credited for experiments,
    basic data analysis, and the design of some figures.
  artifact:
    url: https://doi.org/10.1038/s41746-020-0239-1
    label: Paper, npj Digital Medicine (2020)
  tags: [Medical device, Embedded sensing]

