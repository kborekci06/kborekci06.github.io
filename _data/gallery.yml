# Registry read by index.html (the gallery). Named gallery.yml because _data/experiments/ (the per-design data folders) already owns site.data.experiments.
# One entry per design folder experiments/<group>/<slug>/ (the page is /experiments/<group>/<slug>/), with
# preview.webp (1200x750 screenshot of the page) beside it. Adding a design = its folder plus one entry here.
# A design hosted elsewhere sets url: (absolute) and preview: (a path under /assets/img/gallery/) instead.
# status: working (being developed) | candidate (in the running for the final site) | archived (kept for the record)
- slug: field
  short: F
  title: Field
  summary: "One WebGL cloud of particles driven by native scroll: analytic shapes in the vertex shader, a spring between chapters, an ordered-dither print pass. Proof of concept with placeholder copy."
  designs:
    - { slug: dust, name: Dust, direction: "A single cloud of particles that settles into six formations as you scroll", date: 2026-10, status: working, preview: /assets/img/gallery/dust.webp }
    - { slug: honey, name: Honey, direction: "The Dust field in honey gold and brown, with a dark and a light face", date: 2026-10, status: working, preview: /assets/img/gallery/honey.webp }
    - { slug: stardust, name: Stardust, direction: "The same cloud as star dust in stellar hues, over a still galaxy", date: 2026-10, status: working, preview: /assets/img/gallery/stardust.webp }
- slug: taste
  short: T
  title: Taste
  summary: "Runs of the taste-skill: a researched direction dealt by script, an idea taken from the subject, a no-slop house style checked in a real browser. Built on Next.js, Tailwind and Motion."
  designs:
    - { slug: boundary, name: Boundary, direction: "The name split to two corners; everything he built passes between the halves", date: 2026-10, status: candidate, preview: /assets/img/gallery/boundary.webp }
- slug: marble
  short: M
  title: Marble
  summary: "Stone as a style, not a picture: an onyx canvas, glass slabs, sharp cuts, Garamond display type, dark by default with a light face."
  designs:
    - slug: onyx
      name: Onyx
      direction: "Dark onyx stone under glass slabs"
      date: 2026-09
      status: working
- slug: intro
  short: I
  title: Intro
  summary: "Rounds 2 to 4 of the Home intro on the marble base: how the three pillars (Hardware, Software, People) and the portrait assemble into one fitted stone. Six variants, one branch each, September 2026."
  designs:
    - { slug: morph,    name: Morph,    direction: "Three facets slide off the portrait and join into one row",         date: 2026-09, status: archived }
    - { slug: keystone, name: Keystone, direction: "The portrait as the keystone of an arch of three stones",           date: 2026-09, status: archived }
    - { slug: regroup,  name: Regroup,  direction: "Three stones lock around the face, then regroup into a row",        date: 2026-09, status: archived }
    - { slug: strata,   name: Strata,   direction: "Three horizontal courses with the portrait as a lens through them", date: 2026-09, status: archived }
    - { slug: prism,    name: Prism,    direction: "A hexagonal gem cut into three facets that unfold around the face", date: 2026-09, status: archived }
    - { slug: shard,    name: Shard,    direction: "Shards on a diagonal vein, butted against the portrait",            date: 2026-09, status: archived }
- slug: legacy
  short: L
  title: Legacy
  summary: "The portfolio as it stood before the redesign: minima-based, Montserrat, a circular portrait, project cards with hover video. Source on the legacy branch, served by GitHub Pages."
  designs:
    - { slug: site, name: "2025 site", direction: "The original portfolio, live at kborekci06.github.io", date: 2026-09, status: archived, url: "https://kborekci06.github.io/", preview: /assets/img/gallery/legacy-site.webp }
