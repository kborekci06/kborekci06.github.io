# Registry read by index.html (the gallery). Named gallery.yml because _data/experiments/ (the per-design data folders) already owns site.data.experiments.
# One entry per design folder experiments/<group>/<slug>/ (the page is /experiments/<group>/<slug>/), with
# preview.webp (1200x750 screenshot of the page) beside it. Adding a design = its folder plus one entry here.
# status: working (being developed) | candidate (in the running for the final site) | archived (kept for the record)
- slug: marble
  short: M
  title: Marble
  summary: "Stone as a style, not a picture: an onyx canvas, glass slabs, sharp cuts, Garamond display type, dark by default with a light face."
  designs:
    - slug: onyx
      name: Onyx
      direction: "Dark onyx stone under glass slabs"
      date: 2026-09
      status: working
- slug: intro
  short: I
  title: Intro
  summary: "Rounds 2 to 4 of the Home intro on the marble base: how the three pillars (Hardware, Software, People) and the portrait assemble into one fitted stone. Six variants, one branch each, September 2026."
  designs:
    - { slug: morph,    name: Morph,    direction: "Three facets slide off the portrait and join into one row",         date: 2026-09, status: archived }
    - { slug: keystone, name: Keystone, direction: "The portrait as the keystone of an arch of three stones",           date: 2026-09, status: archived }
    - { slug: regroup,  name: Regroup,  direction: "Three stones lock around the face, then regroup into a row",        date: 2026-09, status: archived }
    - { slug: strata,   name: Strata,   direction: "Three horizontal courses with the portrait as a lens through them", date: 2026-09, status: archived }
    - { slug: prism,    name: Prism,    direction: "A hexagonal gem cut into three facets that unfold around the face", date: 2026-09, status: archived }
    - { slug: shard,    name: Shard,    direction: "Shards on a diagonal vein, butted against the portrait",            date: 2026-09, status: archived }
