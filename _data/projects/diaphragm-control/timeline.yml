title: "Milestones"
items:
  - when: "Fall 2024 (Q1)"
    what: "Proof-of-concept validation"
    detail: "Circuit Playground Express confirmed activity-to-CO₂ correlation. RP2040 and ICM-20948 selected."
  - when: "Fall 2024 (Q1)"
    what: "Firmware development on breadboard"
    detail: "Embedded C drivers for IMU, CO₂, and SD card. Dual-core architecture validated."
  - when: "Winter 2025 (Q2)"
    what: "First SMD PCB failure and solder-board save"
    detail: "SMD board failed days before Q2 presentation. Built solder-board interim device to keep project on track."
  - when: "Spring Break 2025"
    what: "Through-hole PCB designed and fabricated"
    detail: "Deployment-ready board designed in one week. Validated before Q3 start."
  - when: "Spring 2025 (Q3)"
    what: "Second SMD PCB failure confirmed"
    detail: "Through-hole board became the permanent production platform."
  - when: "Spring 2025 (Q3)"
    what: "Provisional patent filed"
    detail: "Invention disclosure accepted.. BMES abstract submitted."
  - when: "Summer 2025"
    what: "BMES 2025 abstract accepted"
    detail: "Presentation at BMES Annual Meeting, San Diego, CA."
  - when: "Summer – Fall 2025"
    what: "Iterative IRB approval process"
    detail: "Multiple rounds of review and revision for human subjects data collection protocol."
  - when: "March 2026 – Present"
    what: "IRB-approved data collection underway"
    detail: "Active collection on healthy subjects. Device in continuous use over one year after design."
  - when: "In Progress"
    what: "IEEE publication in development"
    detail: "Manuscript on device platform and roadmap toward closed-loop diaphragm pacing."