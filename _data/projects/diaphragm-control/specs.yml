rows:
  - label: "9-month academic timeline with IRB and provisional patent deadlines dependent on data collection"
    value: "Parallel-path PCB strategy: initiated a deployment-ready through-hole backup design immediately after the first SMD failure, preserving the project timeline when the second SMD attempt also failed"
  - label: "Clinical partners at Lurie Children's Hospital required physical on-device data storage due to prior reliability issues with Bluetooth and Wi-Fi transmission in collaborators' devices, including hospital RF interference"
    value: "Local CSV output to microSD card with embedded C implementation supporting graceful failure recovery and persistent storage across sessions, allowing up to 100 sequential CSV file writes without requiring SD card removal between trials"
  - label: "~$500 internal department budget with no external grant funding, compounded by component supply disruptions from Spring 2025 economic tariffs"
    value: "Through-hole PCB with off-the-shelf components (RP2040, NDIR sensor, 6-DoF IMU), in-house 3D printing for enclosure"
  - label: "Clinical-grade data quality required for IRB-approved trials and downstream predictive model development"
    value: "Dual-core RP2040 architecture separating real-time sensor polling from storage writes, time-synchronized CSV output (IMU at 100 Hz, CO₂ at 20 Hz)"
  - label: "Autonomic nervous system dysfunction renders conventional physiological feedback signals (e.g., heart rate, heart rate variability) unreliable in the CCHS population"
    value: "System designed around EtCO₂ and 6-DoF inertial measurement as the primary sensing modalities, bypassing autonomic-mediated signals entirely"
  - label: "Patient motion and heavy breathing during high-intensity exercise produce water vapor saturation and movement artifacts that distort the CO₂ waveform"
    value: "Side-sampled CPAP tubing with an inline moisture trap to preserve capnography waveform fidelity during physical exertion"
  - label: "24+ hours of untethered operation required for out-of-clinic monitoring"
    value: "Rechargeable Li-ion battery, migration from CircuitPython to embedded C for power efficiency and low-level hardware control"