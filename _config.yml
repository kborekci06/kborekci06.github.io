---
title: "Kaan Borekci"
description: "Medical Devices · Robotics · AI for Healthcare"

url: "https://kborekci06.github.io" # absolute canonical and og:url (FUN-007)
author:
  name: "Kaan Borekci"
  email: "kaan@borekci.com"
  image: "/assets/img/portrait/kaan-borekci-720.webp"
  alumni_of: "Northwestern University"

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
permalink: pretty

sass:
  style: compressed
  load_paths: ["."] # experiments import their own scss/ by path, e.g. @import "experiments/marble/onyx/scss/site"
  # @import -> @use migration is DES-010 work (minima retirement); color-functions and global-builtin are minima's;
  # if-function is the archived intro variants' (experiments/intro/{shard,strata}), which are not maintained
  silence_deprecations:
    - import
    - color-functions
    - global-builtin
    - if-function

# Tell minima which pages to put in the header nav:
header_pages:
  - index.md
  - experience.md
  - resume.md
  - contact.md

webrick:
  mime_types:
    mp4: video/mp4

# Root files that must never be published to the site
exclude:
  - README.md
  - DEV.md
  - CLAUDE.md
  - CONTEXT.md
  - FILE_MAP.md
  - ISSUE_LOG.md
  - ROADMAP.md
  - Gemfile
  - Gemfile.lock
  - vercel.json
  - skills-lock.json
  - experiments/*/*/README.md
  - vendor
  - node_modules
  - .bundle
  - RESUME_KAAN_BOREKCI_2026.pdf
  - onyx-pattern
  - PILOT_REPORT.md
  - pilot-shots
